# Encaminhamento por DoT para a Cloudflare (o que a imagem mvance/unbound-rpi trazia), em vez da
# resolução recursiva que a klutchell/unbound faz por omissão. Sem forward-first: se o DoT
# falhar, o resultado é erro, nunca DNS em claro (3.1)
server:
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    msg-cache-size: 16m
    rrset-cache-size: 32m

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
