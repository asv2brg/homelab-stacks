services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - /srv/dev-disk-by-uuid-d9adc1b3-9d62-46d5-894b-88e1aba73c45/docker/appdata/uptime-kuma:/app/data
    environment:
      - TZ=Europe/Lisbon

  ntfy:
    image: binwiederhier/ntfy:v2.37.2
    container_name: ntfy
    restart: unless-stopped
    command:
      - serve
    ports:
      - "8082:80"
    volumes:
      - /srv/dev-disk-by-uuid-d9adc1b3-9d62-46d5-894b-88e1aba73c45/docker/appdata/ntfy/cache:/var/cache/ntfy
      - /srv/dev-disk-by-uuid-d9adc1b3-9d62-46d5-894b-88e1aba73c45/docker/appdata/ntfy/etc:/etc/ntfy
    environment:
      - TZ=Europe/Lisbon
