services:
  npm:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - /srv/dev-disk-by-uuid-d9adc1b3-9d62-46d5-894b-88e1aba73c45/docker/appdata/npm/data:/data
      - /srv/dev-disk-by-uuid-d9adc1b3-9d62-46d5-894b-88e1aba73c45/docker/appdata/npm/letsencrypt:/etc/letsencrypt
    environment:
      - TZ=Europe/Lisbon
      - DISABLE_IPV6=true
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
